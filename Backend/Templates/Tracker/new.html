{% extends 'base.html' %}
{% load static %}

{% block title %}Tracker - GPS{% endblock %}


{% block body %}
<div class="pagetitle">
  <h1>Rastreamento de Viagens</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'indexView' %}">Home</a></li>
      <li class="breadcrumb-item active">Rastreamento</li>
    </ol>
  </nav>
</div><!-- End Page Title -->
  
<section class="section dashboard" id="app">
  
  <form class="row g-3" method="POST" action="{% url 'TrackerNewAction' %}" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="row">
    <div class="col-lg-12">
      
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Nome do Talhão</label>
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Nome do Talhão" name="talhao">
      </div>

        <div class="mb-3">
          <label for="formFile" class="form-label">Arquivo de gps</label>
          <input class="form-control" type="file" id="formFile" name="file">
        </div>

        
    </div>

    <div class="col-lg-12">

      <button type="submit" class="btn btn-primary">
      <i class="bx bxs-send"></i>  Enviar
    </button>

      <a href="{% url 'TrackerIndexView' %}" class="btn btn-secondary">
        <i class="bx bxs-plus-circle"></i> Nova análise
      </a>      
      
    </div>
  </div>

    

  </form>
</section>
{% endblock %}

{% block js %}
<script src="{% static 'backend/js/Carro/index.js' %}"></script>
{% endblock %}
